name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  lint:
    name: Lint & Typecheck
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Lint
        run: npm run lint

      - name: Typecheck
        run: npm run typecheck
        env:
          MONGODB_URI: mongodb://localhost:27017/smartmenu
          DB_NAME: smartmenu
          JWT_SECRET: ci-only-secret-for-typechecking
          NEXT_PUBLIC_APP_URL: http://localhost:3000

  build:
    name: Build
    runs-on: ubuntu-latest
    needs: lint
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Install dependencies
        run: npm ci

      - name: Build
        run: npm run build
        env:
          MONGODB_URI: mongodb://localhost:27017/smartmenu
          DB_NAME: smartmenu
          JWT_SECRET: ci-only-secret-for-typechecking
          NEXT_PUBLIC_APP_URL: http://localhost:3000
          NEXT_PUBLIC_AI_PROVIDER: gemini
